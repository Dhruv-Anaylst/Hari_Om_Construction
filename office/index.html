<body class="office-app">
  <aside class="sidebar">

      <span class="brand-symbol"><i></i><i></i><i></i></span>
      <span><strong>HARI OM</strong><small>OFFICE WORKSPACE</small></span>

    <div class="side-label">WORKSPACE</div>

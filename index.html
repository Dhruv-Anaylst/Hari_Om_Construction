<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hari Om Construction</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:#0a1931;
background-image:
linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
background-size:40px 40px;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

.container{
text-align:center;
max-width:800px;
padding:40px;
}

.logo{
font-size:20px;
letter-spacing:6px;
color:#FDBA12;
margin-bottom:20px;
text-transform:uppercase;
}

.circle{
width:140px;
height:140px;
border:4px solid #FDBA12;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:60px;
margin:0 auto 40px;
animation:rotate 12s linear infinite;
}

@keyframes rotate{
100%{
transform:rotate(360deg);
}
}

h1{
font-size:68px;
font-weight:800;
margin-bottom:20px;
}

p{
font-size:20px;
color:#c7d2fe;
line-height:1.8;
margin-bottom:50px;
}

a{
display:inline-block;
padding:16px 38px;
background:#FDBA12;
color:#08111F;
text-decoration:none;
border-radius:50px;
font-weight:700;
transition:.3s;
}

a:hover{
transform:scale(1.08);
}

footer{
margin-top:60px;
font-size:14px;
color:#94a3b8;
}

@media(max-width:768px){

h1{
font-size:42px;
}

p{
font-size:17px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="logo">
Hari Om Construction
</div>

<div class="circle">
🏗
</div>

<h1>Coming Soon</h1>

<p>
Our engineers are building a better digital experience.<br>
We're redesigning our website to serve our clients with a faster, smarter and more secure platform.
</p>

<a href="mailto:info@hariomconstruction.in">Contact Us</a>

<footer>

Engineering India's Gas Distribution Infrastructure

<br><br>

© 2026 Hari Om Construction

</footer>

</div>

</body>
</html>
